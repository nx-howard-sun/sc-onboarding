apiVersion: v1
kind: ConfigMap
metadata:
  name: security-central-config
data:
  PORT: "8080"
  AUDIT_WORKER_ADDR: "worker-service:9090"
---
apiVersion: v1
kind: Secret
metadata:
  name: security-central-secret
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgres@postgres-service:5432/security_central?sslmode=disable"